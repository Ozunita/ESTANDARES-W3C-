<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de estándares web</title>
</head>

<body>
    <main>
        <h1>Formulario de estándares web</h1>
        <form action="#" method="get">
            <p><label for="numero">Número:</label>
                <input type="text" id="numero" name="numero" placeholder="ejemplo 123">
            </p>

            <p>
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo de correo">
            </p>

  
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Jostyn">
            </p>

            
            <p>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Navarrete">
            </p>

          
            <p>
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha">
            </p>

         
            <p>
                <label for="enlace">Enlace:</label>
                <input type="url" id="enlace" name="enlace" placeholder="Link">
            </p>

            
            <fieldset>
                <legend>¿Qué estándares conoces?</legend>

                <p>
                    <input type="checkbox" id="html5" name="estandares" value="HTML5">
                    <label for="html5">HTML5</label>
                </p>

                <p>
                    <input type="checkbox" id="css3" name="estandares" value="CSS3">
                    <label for="css3">CSS3</label>
                </p>

                <p>
                    <input type="checkbox" id="javascript" name="estandares" value="JavaScript">
                    <label for="javascript">JavaScript</label>
                </p>
            </fieldset>

            
            <p>
                <label for="comentarios">Comentarios:</label>
                <textarea id="comentarios" name="comentarios" rows="5" cols="30"></textarea>
            </p>

           
            <p>
                <button type="submit">
                    Enviar la información
                </button>

                <button type="reset">
                    Restablecer
                </button>
            </p>

        </form>

        <section aria-labelledby="integrantes">
            <h2 id="integrantes">Integrantes</h2>

            <ol>
                <li>Navarrete Jostyn</li>
                <li>Zambrano Karla</li>
            </ol>
        </section>

    </main>

</body>
</html>
